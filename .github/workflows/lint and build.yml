name: Lint the project and build the application

on: pull_request

jobs:
  build_and_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: "20.x.x"
          cache: "npm"

      - run: npm install
      - run: npm run lint
      - run: npm run build
